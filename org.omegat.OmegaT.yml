app-id: org.omegat.OmegaT
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk
command: run.sh
finish-args:
  - --filesystem=xdg-documents
  - --socket=x11
  - --share=ipc
  - --share=network

modules:
  - name: openjdk
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk/install.sh

  - name: omegat
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/omegat
      - mv omegatpkg/* /app/share/omegat/
      - install -Dm755 run.sh -t /app/bin/
      - install -Dm644 /app/share/omegat/OmegaT-license.txt -t /app/share/licenses/${FLATPAK_ID}/
    sources:
      - type: archive
        url: https://sourceforge.net/projects/omegat/files/OmegaT%20-%20Standard/OmegaT%206.1.1/OmegaT_6.1.1_Without_JRE.zip
        sha256: 6a99d1f86787b3ec92011b47d8bbd847d85f46ece70b4c6aad637c58eb6af6e9
        dest: omegatpkg
      - type: file
        path: run.sh

  - name: metadata
    buildsystem: simple
    build-commands:
      - install -Dm644 ${FLATPAK_ID}.svg -t /app/share/icons/hicolor/scalable/apps/
      - install -Dm644 ${FLATPAK_ID}.desktop -t /app/share/applications/
      - install -Dm644 ${FLATPAK_ID}.appdata.xml -t /app/share/metainfo/
    sources:
      - type: file
        path: org.omegat.OmegaT.desktop
      - type: file
        path: org.omegat.OmegaT.svg
      - type: file
        path: org.omegat.OmegaT.appdata.xml

